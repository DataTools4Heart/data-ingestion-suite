worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  300s;
    proxy_connect_timeout  300s;
    proxy_send_timeout  300s;
    proxy_read_timeout  300s;

    server {
        listen       80;
        server_name  localhost;

        # Kibana (Executions / Execution Details / Mapping Coverage dashboards)
        location /dt4h/ignifyr/kibana/ {
            proxy_pass http://kibana:5601/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Ignifyr REST API (the web UI calls it relatively as "api")
        location /dt4h/ignifyr/api {
            proxy_pass http://ignifyr-server:8085/ignifyr;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            client_max_body_size 10M;
        }

        # Ignifyr web UI (image built with BASE_HREF=/dt4h/ignifyr/)
        location /dt4h/ignifyr {
            proxy_pass http://ignifyr-web:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # onFHIR with the DT4H CDM definitions
        location /dt4h/onfhir {
            proxy_pass http://onfhir:8080/fhir;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
