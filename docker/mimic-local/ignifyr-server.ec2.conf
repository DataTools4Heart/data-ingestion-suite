# Server variant of ignifyr-server.conf for a 32-vCPU / 128 GB Linux VM (docker-compose.ec2.yml): local[28], 84 partitions,
# 112 shuffle partitions, larger Akka pool. Everything else identical to the laptop configuration.
# Ignifyr server configuration for the local (single JVM, Spark local mode) MIMIC-IV re-execution.
# Mounted at /usr/local/ignifyr/conf/docker/mimic-local/ignifyr-server.conf by docker/mimic-local/docker-compose.yml.
ignifyr {

  # Mounted data-ingestion-suite checkout (CONTEXT_PATH=conf in the compose file overrides this with -Dignifyr.context-path)
  context-path = "./"

  mappings = {
    repository = {
      folder-path = "mappings"
    }
    schemas = {
      repository = {
        folder-path = "schemas"
      }
      fhir-version = "5.0.0"
    }
    contexts = {
      repository = {
        folder-path = "mapping-contexts"
      }
    }
    # Timeout for each mapping execution on an individual input record. The emar mapping joins three large tables
    # per emar row, so keep this generous.
    timeout = 120 seconds
  }

  mapping-jobs = {
    repository = {
      folder-path = "mapping-jobs"
    }

    # Mapping parallelism = min(numOfPartitions, Spark cores). 3x the 28 local cores keeps all cores busy while
    # the per-task memory stays small. (Engine-wide setting.)
    numOfPartitions = 84

    # Rows per chunk: each chunk is mapped, written (unless skipWrite) and logged as one MAPPING_JOB_RESULT /
    # one set of MAPPING_COVERAGE events. 250k gives ~630 chunks for labevents and keeps a chunk well below 2 GB.
    maxChunkSize = 250000
  }

  terminology-systems = {
    folder-path = "terminology-systems"
  }

  archiving = {
    # Erroneous (invalid / not mapped) source rows of the MIMIC job are kept here (saveErroneousRecords = true in the job)
    erroneous-records-folder = "erroneous-records-folder"
    archive-folder = "archive-folder"
    stream-archiving-frequency = 5000
  }

  fhir-server-writer {
    batch-group-size = 100
  }

  db-path = "ignifyr-db"

  functionLibraries {
    rxn {
      className = "io.ignifyr.rxnorm.RxNormApiFunctionLibraryFactory"
      args = ["https://rxnav.nlm.nih.gov", 2]
    }
    cst {
      className = "io.ignifyr.common.util.CustomMappingFunctionsFactory"
    }
  }

  extensions {
    observability {
      coverage {
        # Terminology / concept-map / unit-conversion lookup coverage (MAPPING_COVERAGE events)
        enabled = true
      }
    }
  }
}

fhir = {
  fhir-version = "R5"
  # Only the DT4H CDM definitions are fetched from onFHIR (set through FHIR_DEFINITIONS_ENDPOINT in the compose file)
  definitions-root-urls = ["https://datatools4heart.eu"]
  definitions-fhir-endpoint = "http://onfhir:8080/fhir"
  fhir-endpoint-auth = {
    method = null
  }
  context-path = "./"
  profiles-path = null
  valuesets-path = null
  codesystems-path = null
}

webserver = {
  host = 0.0.0.0
  port = 8085
  base-uri = ignifyr
  ssl {
    keystore = null
    password = null
  }
}

# Spark configurations. Every key except app.name and master is prefixed with "spark." by Ignifyr.
spark = {
  app.name = "MIMIC-IV v3.1 to DT4H CDM"
  # Local mode with 8 worker threads (the container is limited to 8 CPUs). Only safe with Turbo Boost disabled on the
  # host (README 1.1). Executor memory is the JVM heap (JAVA_OPTIONS).
  # Fallback if the package temperature exceeds 90 C: local[6] with cpus 6.0 and numOfPartitions 18.
  master = "local[28]"
  # Spark UI on port 4040 (exposed by the compose file) to watch stages/tasks and memory while a mapping runs
  ui.enabled = "true"
  checkpoint-dir = "checkpoint"
  # Shuffle/spill directory on the named volume (ext4), not on the bind-mounted Windows file system
  local.dir = "/tmp/spark"
  # Joins (admissions x 3 tables, emar x emar_detail x prescriptions) shuffle with this many partitions
  sql.shuffle.partitions = "112"
  # The thermal guard (thermal-guard.ps1) may freeze the container with "docker pause" for minutes while the laptop
  # cools down. Spark's in-process heartbeat must survive such gaps, otherwise the executor exits after the thaw.
  network.timeout = "7200s"
  executor.heartbeatInterval = "60s"
  driver.maxResultSize = "4g"
  # Spark event logs: optional, lets a Spark History Server reconstruct per-stage timings after the run.
  # The directory must exist before the server starts (mkdir -p ignifyr-docker-logs/spark-events in the workspace).
  eventLog.enabled = "true"
  eventLog.dir = "file:///usr/local/ignifyr/logs/spark-events"
  eventLog.compress = "true"
}

akka = {
  daemonic = "on"
  # Mapping expressions (terminology lookups, concept maps) block on futures that run on this dispatcher. Akka's
  # default is one thread per visible CPU core; with the container limited to 8 CPUs the 8 Spark worker threads
  # exhaust the pool and every terminology call times out ("Future timed out after [1 minute]") while the REST
  # API stops answering. Keep the pool well above the Spark thread count.
  actor.default-dispatcher.fork-join-executor {
    parallelism-min = 64
    parallelism-factor = 4.0
    parallelism-max = 128
  }
  http = {
    parsing = {
      max-header-value-length = 82k
    }
    server = {
      server-header = Ignifyr Server
      parsing {
        uri-parsing-mode = relaxed
        max-content-length = 8m
      }
      request-timeout = 300s
      idle-timeout = 300s
      remote-address-header = on
    }
  }
}
